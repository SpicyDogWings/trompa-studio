[package]
name = "app"
version = "0.1.0"
description = "Plantilla Nuxt + Tauri"
authors = ["SpicyDogWings"]
license = ""
repository = "https://github.com/SpicyDogWings/Nuxtri"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"

# PostgreSQL
deadpool-postgres = "0.14"
tokio-postgres = "0.7.18"
futures-util = "0.3"

# TLS con rustls (ring) para no depender de OpenSSL al distribuir
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
